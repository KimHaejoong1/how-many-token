<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>ChatGPT 주간 사용 한도</title>
    <link rel="stylesheet" href="src/popup.css">
    <script type="module" src="src/popup.js"></script>
  </head>
  <body>
    <main class="usage" aria-busy="true">
      <div class="heading">
        <h1>주간 사용 한도</h1>
        <button id="refresh" class="icon-button" type="button" aria-label="사용량 새로고침" title="사용량 새로고침">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5"/>
            <path d="M6.2 6.2A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.8 5.8"/>
          </svg>
        </button>
      </div>
      <div class="details">
        <p id="reset">사용량을 확인하고 있어요</p>
        <p id="remaining">—</p>
      </div>
      <div id="progress" class="track" role="progressbar" aria-label="남은 주간 사용량" aria-valuemin="0" aria-valuemax="100" aria-valuetext="확인 중">
        <div id="fill" class="fill"></div>
      </div>
      <div id="notice" class="notice" hidden>
        <p id="error" role="status"></p>
        <button id="connect" class="text-button" type="button" hidden>ChatGPT 열기</button>
      </div>
      <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    </main>
  </body>
</html>
